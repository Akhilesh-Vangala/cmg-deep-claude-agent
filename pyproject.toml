[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmg-deep-claude-agent"
version = "0.1.0"
description = "Reusable Claude-powered healthcare intelligence agent with MCP tools, Agent Skills, citations, and human review."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "tenacity>=8.3.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]
claude = ["anthropic>=0.40.0"]

[project.scripts]
cmg-agent = "cmg_agent.cli:main"
cmg-eval = "cmg_agent.eval_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
